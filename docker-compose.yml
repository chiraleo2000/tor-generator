# =============================================================================
# TOR Drafting and Review Application - Docker Compose Configuration
# =============================================================================
# Usage:
#   docker compose up                  - Start all core services
#   docker compose --profile qdrant up - Start with optional Qdrant vector DB
#   docker compose down                - Stop services (preserves volumes)
#   docker compose down -v             - Stop services and remove all volumes
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PageIndex: vectorless document indexing and retrieval
  # ---------------------------------------------------------------------------
  pageindex:
    build:
      context: ./services/pageindex
      dockerfile: Dockerfile
    ports:
      - "${PAGEINDEX_PORT:-8100}:8000"
    env_file:
      - .env
    environment:
      - PAGEINDEX_UI_ENABLED=false
      - PAGEINDEX_KB_DIR=/app/knowledge
      - PAGEINDEX_API_KEY=${PAGEINDEX_API_KEY:-}
    volumes:
      - pageindex_data:/app/knowledge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - tor_network

  # ---------------------------------------------------------------------------
  # Frontend: Next.js 14 SSR Application
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        BACKEND_INTERNAL_URL: http://backend:4000/api/v1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - BACKEND_INTERNAL_URL=http://backend:4000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tor_network

  # ---------------------------------------------------------------------------
  # Backend: FastAPI + LangGraph AI Orchestration
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-on_prem}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-tor_app}
      - POSTGRES_USER=${POSTGRES_USER:-tor_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-tor-documents}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LM_STUDIO_BASE_URL=${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      - LM_STUDIO_MODEL=${LM_STUDIO_MODEL:-google/gemma-4-e4b}
      - LM_STUDIO_EMBEDDING_MODEL=${LM_STUDIO_EMBEDDING_MODEL:-text-embedding-embeddinggemma-300m}
      - LM_STUDIO_TIMEOUT=${LM_STUDIO_TIMEOUT:-1800}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLAMA_CPP_BASE_URL=${LLAMA_CPP_BASE_URL:-http://host.docker.internal:8080/v1}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
      - LLM_PROVIDER=${LLM_PROVIDER:-azure_foundry}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-none}
      - LOCAL_EMBEDDING_SERVER=${LOCAL_EMBEDDING_SERVER:-lm_studio}
      - LOCAL_EMBEDDING_BASE_URL=${LOCAL_EMBEDDING_BASE_URL:-}
      - VECTOR_STORE_PROVIDER=${VECTOR_STORE_PROVIDER:-pgvector}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017}
      - MONGO_DB=${MONGO_DB:-tor_docs}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme_neo4j}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:-}
      - BEDROCK_REGION=${BEDROCK_REGION:-ap-southeast-1}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-global.anthropic.claude-sonnet-4-6}
      - CLOUD_LLM_TIMEOUT=${CLOUD_LLM_TIMEOUT:-300}
      - BEDROCK_EMBEDDING_MODEL_ID=${BEDROCK_EMBEDDING_MODEL_ID:-amazon.titan-embed-text-v2:0}
      - AZURE_FOUNDRY_ENDPOINT=${AZURE_FOUNDRY_ENDPOINT:-}
      - AZURE_FOUNDRY_API_KEY=${AZURE_FOUNDRY_API_KEY:-}
      - AZURE_FOUNDRY_DEPLOYMENT=${AZURE_FOUNDRY_DEPLOYMENT:-gpt-5.6-luna}
      - AZURE_FOUNDRY_EMBEDDING_DEPLOYMENT=${AZURE_FOUNDRY_EMBEDDING_DEPLOYMENT:-}
      - AZURE_FOUNDRY_API_VERSION=${AZURE_FOUNDRY_API_VERSION:-v1}
      - OPENAI_COMPATIBLE_BASE_URL=${OPENAI_COMPATIBLE_BASE_URL:-}
      - OPENAI_COMPATIBLE_API_KEY=${OPENAI_COMPATIBLE_API_KEY:-}
      - OPENAI_COMPATIBLE_MODEL=${OPENAI_COMPATIBLE_MODEL:-}
      - OPENAI_COMPATIBLE_EMBEDDING_MODEL=${OPENAI_COMPATIBLE_EMBEDDING_MODEL:-text-embedding-3-small}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - KNOWLEDGE_BASE_DIR=/knowledge-base
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS:-24}
      - RATE_LIMIT_REQUESTS_PER_MINUTE=${RATE_LIMIT_REQUESTS_PER_MINUTE:-100}
      - RATE_LIMIT_UPLOADS_PER_MINUTE=${RATE_LIMIT_UPLOADS_PER_MINUTE:-10}
      - RATE_LIMIT_AI_PER_MINUTE=${RATE_LIMIT_AI_PER_MINUTE:-30}
      - LLM_MAX_CONCURRENT=${LLM_MAX_CONCURRENT:-8}
      - EMBEDDING_MAX_CONCURRENT=${EMBEDDING_MAX_CONCURRENT:-16}
      - LLM_QUEUE_WAIT_TIMEOUT_SECONDS=${LLM_QUEUE_WAIT_TIMEOUT_SECONDS:-120}
      - SGLANG_BASE_URL=${SGLANG_BASE_URL:-http://sglang-llm:30000/v1}
      - SGLANG_EMBEDDING_BASE_URL=${SGLANG_EMBEDDING_BASE_URL:-http://sglang-embed:30001/v1}
      - SGLANG_MODEL=${SGLANG_MODEL:-google/gemma-4-e4b}
      - SGLANG_EMBEDDING_MODEL=${SGLANG_EMBEDDING_MODEL:-google/embeddinggemma-300m}
      # The TOR app uses Betimes PageIndex RAG as its primary retrieval source.
      - CUSTOM_RAG_ENABLED=${CUSTOM_RAG_ENABLED:-true}
      - CUSTOM_RAG_BASE_URL=${CUSTOM_RAG_BASE_URL:-http://pageindex:8000/api/search}
      - CUSTOM_RAG_API_KEY=${CUSTOM_RAG_API_KEY:-}
      - CUSTOM_RAG_TOP_K=${CUSTOM_RAG_TOP_K:-5}
      - CUSTOM_RAG_TIMEOUT_SECONDS=${CUSTOM_RAG_TIMEOUT_SECONDS:-30}
      - CHAT_RAG_TOP_K=${CHAT_RAG_TOP_K:-64}
      - CHAT_MAX_CONTEXT_CHUNKS=${CHAT_MAX_CONTEXT_CHUNKS:-80}
      - DRAFT_RAG_TOP_K=${DRAFT_RAG_TOP_K:-24}
      - RAG_SOURCES=${RAG_SOURCES:-custom}
      - KB_SOURCES_ROOT=${KB_SOURCES_ROOT:-/documents/sources}
      - PAGEINDEX_BASE_URL=${PAGEINDEX_BASE_URL:-http://pageindex:8000}
      - PAGEINDEX_API_KEY=${PAGEINDEX_API_KEY:-}
      - PAGEINDEX_INGEST_TIMEOUT_SECONDS=${PAGEINDEX_INGEST_TIMEOUT_SECONDS:-1800}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mongo:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      pageindex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./documents/knowledge-base:/knowledge-base:ro
      - ./documents/sources:/documents/sources:ro
      - ./debug-6fb0cb.log:/tmp/debug-6fb0cb.log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tor_network

  # ---------------------------------------------------------------------------
  # PostgreSQL 15 with pgvector extension (Vector Database)
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tor_app}
      POSTGRES_USER: ${POSTGRES_USER:-tor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tor_user} -d ${POSTGRES_DB:-tor_app}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tor_network

  # ---------------------------------------------------------------------------
  # Redis 7 (Session Cache, Rate Limiting, Background Job Queue)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis_password}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tor_network

  # ---------------------------------------------------------------------------
  # MinIO (S3-Compatible Object Storage for Documents)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-changeme_minio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tor_network

  # ---------------------------------------------------------------------------
  # MongoDB 7 (GridFS originals for baseline + per-user documents)
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-tor_docs}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - tor_network

  # ---------------------------------------------------------------------------
  # Neo4j 5 (GraphRAG: Law / Article / TorSlot)
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme_neo4j}
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_initial__size: 512M
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 50s
    networks:
      - tor_network

  # ---------------------------------------------------------------------------
  # Qdrant (Optional Vector Database - activated with --profile qdrant)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    profiles:
      - qdrant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tor_network

  # ---------------------------------------------------------------------------
  # SGLang (optional on-prem inference)
  #   docker compose --profile sglang up            → sglang-llm only (:30000)
  #   docker compose --profile sglang-embed up      → embeddings only (:30001), re-seed
  # Requires NVIDIA Container Toolkit. One GPU: do not also load Gemma in LM Studio.
  # Chat uses sglang-llm when /health is up; otherwise falls back to LM Studio :1234.
  # Do not start sglang-embed on the same GPU as sglang-llm unless re-seeding vectors.
  # Production on AWS typically uses Bedrock instead.
  # ---------------------------------------------------------------------------
  sglang-llm:
    image: lmsysorg/sglang:latest-runtime
    profiles: [sglang]
    ipc: host
    shm_size: "32gb"
    ports:
      - "30000:30000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    entrypoint: python3 -m sglang.launch_server
    command:
      - --model-path
      - ${SGLANG_MODEL:-google/gemma-4-e4b}
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --mem-fraction-static
      - "0.75"
      - --grammar-backend
      - xgrammar
      - --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - tor_network

  sglang-embed:
    image: lmsysorg/sglang:latest-runtime
    profiles: [sglang-embed]
    ipc: host
    shm_size: "8gb"
    ports:
      - "30001:30001"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    entrypoint: python3 -m sglang.launch_server
    command:
      - --model-path
      - ${SGLANG_EMBEDDING_MODEL:-google/embeddinggemma-300m}
      - --is-embedding
      - --host
      - 0.0.0.0
      - --port
      - "30001"
      - --mem-fraction-static
      - "0.15"
      - --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - tor_network

# =============================================================================
# Named Volumes (persistent across container restarts)
# =============================================================================
volumes:
  pg_data:
  minio_data:
  qdrant_data:
  mongo_data:
  neo4j_data:
  pageindex_data:
  huggingface_cache:

# =============================================================================
# Networks (shared bridge for inter-service communication by container name)
# =============================================================================
networks:
  tor_network:
    driver: bridge
