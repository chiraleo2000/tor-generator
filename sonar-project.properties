sonar.projectKey=tor-drafting-review-app
sonar.projectName=TOR drafting and review app
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

sonar.sources=app/frontend/src,app/backend/app
sonar.tests=app/frontend/src,app/backend/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/tests/**/*.py
# Python \\d matches Thai digits; money/date regexes must stay ASCII [0-9].
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S6353
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py
# Reusable Label forwards htmlFor/children from each call site.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6853
sonar.issue.ignore.multicriteria.e2.resourceKey=**/components/ui/label.tsx
# Local MCP stubs use stdlib loopback HTTP servers (not production).
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e3.resourceKey=**/infra/mcp/servers/*.py
sonar.test.exclusions=**/node_modules/**,**/.next/**
sonar.exclusions=**/node_modules/**,**/.next/**,**/documents/**,**/discussions/**,**/coverage/**,**/e2e/**,**/*.test.ts,**/*.test.tsx,**/__pycache__/**,**/*.pyc

sonar.python.coverage.reportPaths=app/backend/coverage.xml
sonar.javascript.lcov.reportPaths=app/frontend/coverage/lcov.info
sonar.coverage.exclusions=**/components/draft/draft-workspace.tsx
