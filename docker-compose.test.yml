# Dev-only overlay: production backend image omits tests/ (.dockerignore).
# Usage:
#   docker compose -p tor-app --env-file .env -f docker-compose.yml -f docker-compose.test.yml exec backend python -m pytest ...
services:
  backend:
    volumes:
      - ./app/backend/tests:/app/tests:ro
      - ./app/backend/scripts:/app/scripts:ro
      - ./app/backend/pyproject.toml:/app/pyproject.toml:ro
      - ./app/infra:/app/infra
      - ./app/backend/app/domain:/app/app/domain
      - ./documents:/app/documents
      - ./documents/research:/documents/research
      - ./documents/sources:/documents/sources
      - ./skills:/app/skills
      - ./Discussions:/app/Discussions
      - ./docker-compose.yml:/app/docker-compose.yml:ro
