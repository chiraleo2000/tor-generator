# TOR PN on EC2 — MCP + webapp. Knowledge on S3. No Fargate.
# Usage (from this directory):
#   cp .env.example .env   # then edit
#   docker compose -f docker-compose.pn.yml --env-file .env up -d --build
#
# Build contexts are relative to this file (app/infra/pn-ec2/).
# ../../frontend → app/frontend (Next.js webapp). ../../backend → app/backend.
# Do not use a leftover ./frontend folder at the repo root.

name: ${COMPOSE_PROJECT_NAME:-tor-pn}

services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      # app/frontend — PN Compose file is under app/infra/pn-ec2/
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        BACKEND_INTERNAL_URL: http://backend:4000/api/v1
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      BACKEND_INTERNAL_URL: http://backend:4000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks: [pn_net]
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-cloud}
      PIN_ON_PREM_LLM: ${PIN_ON_PREM_LLM:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-bedrock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-bedrock}
      BEDROCK_REGION: ${BEDROCK_REGION:-ap-southeast-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID}
      BEDROCK_EMBEDDING_MODEL_ID: ${BEDROCK_EMBEDDING_MODEL_ID:-cohere.embed-v4:0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_BUCKET: ${MINIO_BUCKET:-${PN_S3_BUCKET}}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      MINIO_REGION: ${MINIO_REGION:-ap-southeast-1}
      MINIO_USE_IAM: ${MINIO_USE_IAM:-true}
      PN_RAG_GROUPS_PATH: ${PN_RAG_GROUPS_PATH:-/pn-config/rag-groups.yaml}
      PN_S3_BUCKET: ${PN_S3_BUCKET:-}
      PN_S3_VECTOR_BUCKET: ${PN_S3_VECTOR_BUCKET:-}
      PN_RETRIEVE_BACKEND: ${PN_RETRIEVE_BACKEND:-s3_vectors}
      PN_CHUNK_TARGET_TOKENS: ${PN_CHUNK_TARGET_TOKENS:-4096}
      PN_CHUNK_OVERLAP_TOKENS: ${PN_CHUNK_OVERLAP_TOKENS:-384}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      MCP_RAG_ENABLED: ${MCP_RAG_ENABLED:-true}
      MCP_RAG_SERVERS_JSON: ${MCP_RAG_SERVERS_JSON:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./rag-groups.yaml:/pn-config/rag-groups.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/api/v1/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [pn_net]
    restart: unless-stopped

  mcp-rag:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file: .env
    command: ["python", "-m", "app.mcp_retrieve_server"]
    environment:
      MCP_RAG_SERVER_HOST: 0.0.0.0
      MCP_RAG_SERVER_PORT: "8765"
      MCP_RAG_ENABLED: "false"
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-bedrock}
      BEDROCK_EMBEDDING_MODEL_ID: ${BEDROCK_EMBEDDING_MODEL_ID:-cohere.embed-v4:0}
      BEDROCK_REGION: ${BEDROCK_REGION:-ap-southeast-1}
      PN_RAG_GROUPS_PATH: /pn-config/rag-groups.yaml
      PN_S3_BUCKET: ${PN_S3_BUCKET:-}
      PN_S3_VECTOR_BUCKET: ${PN_S3_VECTOR_BUCKET:-}
      PN_RETRIEVE_BACKEND: ${PN_RETRIEVE_BACKEND:-s3_vectors}
      PN_CHUNK_TARGET_TOKENS: ${PN_CHUNK_TARGET_TOKENS:-4096}
      PN_RETRIEVE_TOP_K: ${PN_RETRIEVE_TOP_K:-3}
      PN_RETRIEVE_TOP_K_MAX: ${PN_RETRIEVE_TOP_K_MAX:-5}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      MINIO_USE_IAM: ${MINIO_USE_IAM:-true}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_BUCKET: ${MINIO_BUCKET:-${PN_S3_BUCKET}}
      MINIO_REGION: ${MINIO_REGION:-ap-southeast-1}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./rag-groups.yaml:/pn-config/rag-groups.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [pn_net]
    restart: unless-stopped

  amazon-quick:
    image: python:3.12-slim
    working_dir: /quick
    command: ["python", "mcp_server.py"]
    env_file: .env
    environment:
      QUICK_MCP_HOST: 0.0.0.0
      QUICK_MCP_PORT: "8767"
      QUICK_RAG_MCP_URL: ${QUICK_RAG_MCP_URL:-http://mcp-rag:8765/mcp}
      QUICK_MCP_AUTH_HEADER: ${QUICK_MCP_AUTH_HEADER:-Authorization}
      QUICK_MCP_AUTH_VALUE: ${QUICK_MCP_AUTH_VALUE:-}
    volumes:
      - ../quick:/quick:ro
    ports:
      - "${MCP_HOST_PORT:-8767}:8767"
    depends_on:
      - mcp-rag
    networks: [pn_net]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/pn.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
      - amazon-quick
    networks: [pn_net]
    restart: unless-stopped
    profiles: ["with-nginx"]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tor_pn}
      POSTGRES_USER: ${POSTGRES_USER:-tor_pn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tor_pn} -d ${POSTGRES_DB:-tor_pn}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pn_net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - pn_redis:/data
    networks: [pn_net]
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - pn_mongo:/data/db
    networks: [pn_net]
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme_neo4j}
    volumes:
      - pn_neo4j:/data
    networks: [pn_net]
    restart: unless-stopped
    profiles: ["with-neo4j"]

volumes:
  pn_pgdata:
  pn_redis:
  pn_mongo:
  pn_neo4j:

networks:
  pn_net:
    driver: bridge
