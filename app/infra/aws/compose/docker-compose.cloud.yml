# Local experiment with *cloud env labels only*.
# Does not start LM Studio. Point LLM at Bedrock via env.cloud.example (IAM/keys).
# Not a substitute for ECS/RDS. See Discussions/30 and 24–27.

name: tor-cloud-shape

services:
  backend:
    image: tor-app-backend:latest
    env_file:
      - ../../../.env
    environment:
      DEPLOYMENT_MODE: cloud
      LLM_PROVIDER: bedrock
      EMBEDDING_PROVIDER: bedrock
      MCP_RAG_ENABLED: ${MCP_RAG_ENABLED:-false}
      MCP_RAG_SERVERS_JSON: ${MCP_RAG_SERVERS_JSON:-}
      MCP_RAG_TIMEOUT_SECONDS: ${MCP_RAG_TIMEOUT_SECONDS:-20}
      MCP_RAG_AUTH_HEADER: ${MCP_RAG_AUTH_HEADER:-Authorization}
      MCP_RAG_AUTH_VALUE: ${MCP_RAG_AUTH_VALUE:-}
      CUSTOM_RAG_ENABLED: ${CUSTOM_RAG_ENABLED:-false}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      CLOUD_LLM_TIMEOUT: ${CLOUD_LLM_TIMEOUT:-300}
    ports:
      - "4000:4000"
    profiles: ["cloud-shape"]
