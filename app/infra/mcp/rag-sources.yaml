# MCP RAG sources (optional extra retrieve — not the local LLM)

# Local Compose does **not** call these servers. Chat/embeddings use LM Studio
# and pgvector from documents/sources (see list_mandatory_sources).
#
# MCP_RAG_ENABLED=false in .env. Even if set true, every server below stays
# enabled: false until a real agency URL exists.
# retrieve-stub returns fake mcp-retrieve-stub chunks — never enable it for
# legal answers.
#
# ECS: use MCP_RAG_SERVERS_JSON (this YAML is not in the backend image).

servers:
  - id: agency-legal-mcp
    enabled: false
    transport: http
    url: https://mcp.example.go.th/rag
    tool: retrieve
    timeout_seconds: 20
    top_k: 8
  - id: partner-kb-mcp
    enabled: false
    transport: http
    url: https://mcp-partner.example.go.th/v1
    tool: retrieve
    timeout_seconds: 20
    top_k: 8
  # Compose: docker compose --profile mcp-stub up
  - id: retrieve-stub
    enabled: false
    transport: http
    url: http://mcp-stub:8765
    tool: retrieve
    timeout_seconds: 20
    top_k: 8
