# MCP RAG sources (skeleton)

# Production remains AWS Cloud-only (Bedrock). These servers are extra **data** sources, not a hybrid LLM.

# Local/dev: set MCP_RAG_ENABLED=true and MCP_RAG_CONFIG_PATH to this file.
# ECS: the backend image does not include this path — use MCP_RAG_SERVERS_JSON (see servers.example.json).

servers:
  - id: agency-legal-mcp
    enabled: false
    transport: http
    url: https://mcp.example.go.th/rag
    tool: retrieve
    timeout_seconds: 20
    top_k: 8
  - id: partner-kb-mcp
    enabled: false
    transport: http
    url: https://mcp-partner.example.go.th/v1
    tool: retrieve
    timeout_seconds: 20
    top_k: 8
  - id: retrieve-stub
    enabled: false
    transport: http
    url: http://host.docker.internal:8765
    tool: retrieve
    timeout_seconds: 20
    top_k: 8
