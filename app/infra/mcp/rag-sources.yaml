# MCP RAG sources (skeleton)

# Production remains AWS Cloud-only (Bedrock). These servers are extra **data** sources, not a hybrid LLM.

Set `MCP_RAG_ENABLED=true` and `MCP_RAG_CONFIG_PATH` to this file (or another path in the task).

servers:
  - id: agency-legal-mcp
    enabled: false
    transport: http
    url: https://mcp.example.go.th/rag
    tool: retrieve
    timeout_seconds: 20
    top_k: 8
  - id: partner-kb-mcp
    enabled: false
    transport: http
    url: https://mcp-partner.example.go.th/v1
    tool: retrieve
    timeout_seconds: 20
    top_k: 8
