# MCP RAG sources (extra retrieve — not the chat LLM)

# Local Compose: MCP_RAG_ENABLED=true and local-pgvector-mcp enabled.
# The mcp-rag service retrieves from the same pgvector corpus as local RAG
# (documents/sources). Chat/embeddings stay on LM Studio.
#
# agency-legal-mcp / partner-kb-mcp stay off until a real agency URL exists.
# retrieve-stub returns fake mcp-retrieve-stub chunks — keep it disabled.
#
# ECS: use MCP_RAG_SERVERS_JSON (this YAML is not in the backend image).

servers:
  - id: local-pgvector-mcp
    enabled: true
    transport: http
    url: http://mcp-rag:8765
    tool: retrieve
    timeout_seconds: 20
    top_k: 8
  - id: agency-legal-mcp
    enabled: false
    transport: http
    url: https://mcp.example.go.th/rag
    tool: retrieve
    timeout_seconds: 20
    top_k: 8
  - id: partner-kb-mcp
    enabled: false
    transport: http
    url: https://mcp-partner.example.go.th/v1
    tool: retrieve
    timeout_seconds: 20
    top_k: 8
  # Fake JSON-RPC stub: docker compose --profile mcp-stub up (host port 8766)
  - id: retrieve-stub
    enabled: false
    transport: http
    url: http://mcp-stub:8765
    tool: retrieve
    timeout_seconds: 20
    top_k: 8
