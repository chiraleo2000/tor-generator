# Alembic Configuration File
# For TOR Drafting and Review Application

[alembic]
# Path to migration scripts directory
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# Set to 'true' to run the environment during the 'revision' command
prepend_sys_path = .

# Timezone to use when rendering the date within the migration file
timezone = Asia/Bangkok

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to true to search source files in the versions directory recursively
recursive_version_locations = false

# The database URL is loaded from environment via env.py (not hardcoded here)
# sqlalchemy.url is intentionally left blank - resolved dynamically in env.py
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
